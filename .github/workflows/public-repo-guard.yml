name: Public repository guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject private source and release binaries
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -Ei '\.(py|pyc|pyd|spec|iss|ps1|bat|cmd|exe|dll|pdb|msi|zip|7z)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Private source or release binaries must not be committed:"
            echo "$forbidden"
            exit 1
          fi

      - name: Detect common secret formats
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude=public-repo-guard.yml 'AIza[0-9A-Za-z_-]{20,}' .; then
            echo "A Gemini API key pattern was found."
            exit 1
          fi
          if grep -RInE --exclude-dir=.git --exclude=public-repo-guard.yml -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' .; then
            echo "A private key was found."
            exit 1
          fi
          if grep -RInE --exclude-dir=.git --exclude=public-repo-guard.yml '(GEMINI_API_KEY|ASSEMBLYAI_API_KEY|GEMINI_RELAY_TOKEN)=[^[:space:]]+' .; then
            echo "A non-empty secret variable was found."
            exit 1
          fi
          if grep -RInE --exclude-dir=.git --exclude=public-repo-guard.yml 'ws://[A-Za-z0-9._:-]+' .; then
            echo "An unencrypted relay address was found."
            exit 1
          fi

      - name: Verify public documentation
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CHANGELOG.md
          test -f ROADMAP.md
          test -f WORKLOG.md
          test -f SECURITY.md
          test -f PRIVACY.md
          test -f assets/brand/hearspan-logo.png
          test -f assets/brand/hearspan-icon-1024.png
